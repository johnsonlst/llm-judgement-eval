[project]
name = "llm-judgement-eval"
version = "0.1.0"
description = "Archive, replay and score the judgement calls an LLM makes inside an automated system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []          # standard library only

[project.optional-dependencies]
prices = ["yfinance>=0.2"]  # only for outcome evals
dev = ["pytest>=8"]

[project.scripts]
lje-replay = "lje.replay:main"
lje-consistency = "lje.evals.consistency:main"
lje-gdelt = "lje.sources.gdelt:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lje*"]
